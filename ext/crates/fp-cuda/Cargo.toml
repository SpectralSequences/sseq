[package]
name = "fp-cuda"
version = "0.1.0"
edition = "2024"
authors = ["Joey Beauvais-Feisthauer <joeybf@wayne.edu>"]
description = "CUDA backend for fp's F_2 BLAS routines (Hopper wgmma.b1 via inline PTX)"
license = "MIT OR Apache-2.0"
publish = false

# See README.md for what this crate is and how to build it. The kernel is compiled at runtime by
# NVRTC, so there is no build script and building needs no CUDA Toolkit.

[dependencies]
anyhow = "1.0.98"

# Driver API + NVRTC (the kernel is compiled at runtime). `cuda-12080` selects which pre-generated
# bindings to compile; it does not pin the driver or the toolkit, since `dynamic-loading` dlopen's
# the real libcuda/libnvrtc at runtime, so newer ones (12.8+/13.x) still work and the crate builds
# with no CUDA present.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12080",
    "dynamic-loading",
] }

[dev-dependencies]
# The library API is fp-agnostic (raw limbs), so that the higher-level `fp` crate
# can depend on `fp-cuda` without a dependency cycle. Only the examples and benches use `fp`.
fp = { path = "../fp", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"

[[bench]]
name = "matmul_b1"
harness = false
