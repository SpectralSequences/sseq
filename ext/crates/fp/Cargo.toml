[package]
name = "fp"
version = "0.1.0"
authors = ["Dexter Chua <dexter@math.harvard.edu>"]
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aligned-vec = { version = "0.6.4", features = ["serde"] }
build_const = "0.2.2"
byteorder = "1.5.0"
cfg-if = "1.0.1"
dashmap = "6"
either = "1.15.0"
itertools = { version = "0.14.0" }
paste = "1.0.15"
proptest = { version = "1.7", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

maybe-rayon = { path = "../maybe-rayon" }
query = { path = "../query" }

# GPU backend (Hopper wgmma.b1). Optional and off by default: gated behind the
# `gpu` feature. `fp-cuda`'s library is fp-agnostic (raw limbs), so this
# dependency does not form a cycle. Building it requires nvcc at build time (a
# stub PTX is emitted otherwise) and a Hopper GPU + driver at runtime.
fp-cuda = { path = "../fp-cuda", optional = true }

[dev-dependencies]
# We use the proptest harness for our own tests
fp = { path = ".", default-features = false, features = ["proptest"] }
criterion = { version = "0.5", features = ["html_reports"] }
expect-test = "1.5.1"
pprof = { version = "0.15.0", features = ["criterion", "flamegraph"] }
proptest = "1.7"
rand = "0.9.2"
rstest = "0.26.0"

[build-dependencies]
build_const = "0.2.2"

[features]
default = ["odd-primes"]
concurrent = ["maybe-rayon/concurrent"]
odd-primes = []
# Dispatch large p=2 matrix products to the Hopper GPU backend (`fp-cuda`).
gpu = ["dep:fp-cuda"]

[[bench]]
name = "mul"
harness = false

[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "smallfq"
harness = false
