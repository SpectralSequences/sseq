[package]
name = "fp"
version = "0.1.0"
authors = ["Dexter Chua <dexter@math.harvard.edu>"]
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aligned-vec = { version = "0.6.4", features = ["serde"] }
build_const = "0.2.2"
byteorder = "1.5.0"
cfg-if = "1.0.1"
dashmap = "6"
either = "1.15.0"
itertools = { version = "0.14.0" }
paste = "1.0.15"
proptest = { version = "1.7", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

maybe-rayon = { path = "../maybe-rayon" }
query = { path = "../query" }

# GPU backend (Hopper wgmma.b1), gated behind the `gpu` feature and off by default.
anyhow = { version = "1.0.98", optional = true }
# Driver API + NVRTC (the kernel is compiled at runtime). `cuda-12080` selects which pre-generated
# bindings to compile; it does not pin the driver or the toolkit, since `dynamic-loading` dlopen's
# the real libcuda/libnvrtc at runtime, so newer ones (12.8+/13.x) still work and the crate builds
# with no CUDA present.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12080",
    "dynamic-loading",
] }

[dev-dependencies]
# We use the proptest harness for our own tests
fp = { path = ".", default-features = false, features = ["proptest"] }
criterion = { version = "0.5", features = ["html_reports"] }
expect-test = "1.5.1"
pprof = { version = "0.15.0", features = ["criterion", "flamegraph"] }
proptest = "1.7"
rand = "0.9.2"
rstest = "0.26.0"

[build-dependencies]
build_const = "0.2.2"

[features]
default = ["odd-primes"]
concurrent = ["maybe-rayon/concurrent"]
odd-primes = []
# Dispatch large p=2 matrix products to the Hopper GPU backend in `blas::cuda`.
gpu = ["dep:anyhow", "dep:cudarc"]

[[bench]]
name = "mul"
harness = false

[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "smallfq"
harness = false
required-features = ["odd-primes"]

[[bench]]
name = "matmul_b1"
harness = false
required-features = ["gpu"]

# The GPU examples. The kernel runs only on Hopper; see `src/blas/cuda/README.md`.
[[example]]
name = "bench_kernel_only"
required-features = ["gpu"]

[[example]]
name = "bench_shapes"
required-features = ["gpu"]

[[example]]
name = "kernel_ptx"
required-features = ["gpu"]
